---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vantor-app
spec:
  replicas: 3
  # selector:
  #   matchLabels:
  #     you: me
  template:
    metadata:
      labels:
        you: me
    spec:
      containers:
        - name: db
          image: registry.fedoraproject.org/f32/mysql
          resources:
            requests:
              cpu: 20m
              memory: 50M
            limits:
              cpu: 40m
              memory: 100M
